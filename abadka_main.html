<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"rel="stylesheet">
        
    <script src="main.js" defer></script>
    <title>Abadka</title>
</head>

<body>
    <header>
        <nav>
            <img class="logo" src="img/logo-removebg-preview.png" alt="logo">
            <a class="nav" href="#">Головна</a>
            <a class="nav" href="#">Про нас</a>
            <a class="nav" href="#"></a>

        </nav>
    </header>

    <main>
        <input type="checkbox" id="menu">
        <label for="menu">
            <img class="book_img" src="img/book.png">

        </label>

        <img class="cart" src="img/shoppingcart-removebg-preview.png" alt="cart">
        <nav class="navbar">
            <ul>
                <li><a class="genre" href="">Бестселери</a></li>
                <li><a class="genre" href="">Жахи</a></li>
                <li><a class="genre" href="">Казки</a></li>
                <li><a class="genre" href="">Любовні романи</a></li>
                <li><a class="genre" href="">Пригоди</a></li>
                <li><a class="genre" href="">Фантастика</a></li>
                <li><a class="genre" href="">Антиутопії</a></li>
            </ul>
        </nav>



        <h1 class="book_genre">Бестселери</h1>
        <div class="main_books">


            <div class="cards">
                <div class="card">
                    <img class="card_img" src="img/Abadka.jpg">
                    <p class="price">45$</p>
                    <button class="buy_btn" data-title="Abadka" data-price="45" href="#">Купити</button>
                </div>
                <div class="card">
                    <img class="card_img" src="img/metro2033.webp">
                    <p class="price">45$</p>
                    <button class="buy_btn" data-title="Metro 2033" data-price="45" href="#">Купити</button>
                </div>
                <div class="card">
                    <img class="card_img" src="img/metro2034.jpg">
                    <p class="price">45$</p>
                    <button class="buy_btn" data-title="Metro 2034" data-price="45" href="#">Купити</button>

                </div>
                <div class="card">
                    <img class="card_img" src="img/metro2035.webp">
                    <p class="price">45$</p>
                    <button class="buy_btn" data-title="Metro 2035" data-price="45" href="#">Купити</button>
                </div>
                <div class="card">
                    <img class="card_img" src="img/rick and morty.jpg">
                    <p class="price">45$</p>
                    <button class="buy_btn" data-title="Rick and Morty" data-price="45" href="#">Купити</button>

                </div>
                <div class="card">
                    <img class="card_img" src="img/gravity falls.jpg">
                    <p class="price">45$</p>
                    <button class="buy_btn" data-title="Gravity Falls" data-price="45" href="#">Купити</button>
                </div>

            </div>
        </div>
    </main>
    <div id="cartModal" class="cart-modal">
  <div class="cart-content">
    <span class="close-cart">&times;</span>
    <h2>Ваш кошик</h2>
    <ul id="cart-items"></ul>
    <p id="total-price">Загальна сума: $0</p>
    <button id="clear-cart">Очистити кошик</button>
    <button id="checkout">Оформити замовлення</button>
  </div>
</div>

</body>
<link rel="stylesheet" href="style_main.css">


</html>
